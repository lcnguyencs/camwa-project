<div class="page-container">
  <div class="modules-info">
    <h1>Account Detail</h1>
  </div>

  <div class="module-detail">
    <div class="form-group row">
      <div class="field">
        <label>Account Name:</label>
        <input type="text" style="width: 288px;" [(ngModel)]="accountData.username"/>
      </div>
      <div class="field">
        <label>Role:</label>
        <select style="width: 288px;" [(ngModel)]="accountData.role">
          <option value="" disabled selected>Select Role</option>
          <option *ngFor="let role of roles" [value]="role">
            {{ role }}
          </option>
        </select>
      </div>
    </div>

    <div class="form-group row" style="margin-top: 6px;">
      <div class="field">
        <label>ID:</label>
        <input type="text" [(ngModel)]="accountData.accId" readonly/>
      </div>
      <div class="field">
        <label>Intake:</label>
        <select [(ngModel)]="accountData.intake" disabled>
          <option value="" disabled selected>Select Intake</option>
          <option *ngFor="let intake of intakes" [value]="intake">{{ intake }}</option>
        </select>
      </div>
      <div class="field">
        <label>Program:</label>
        <select [(ngModel)]="accountData.program" disabled>
          <option value="" disabled selected>Select Program</option>
          <option *ngFor="let program of programs" [value]="program.program_id">
            {{ program.name }}
          </option>
        </select>
      </div>
    </div>

    <div class="form-group row">
      <div class="field">
        <label>Email:</label>
        <input type="email" style="width: 395px;" [(ngModel)]="accountData.email"/>
      </div>
    </div>

    <div class="form-group row">
      <div class="field">
        <label>Password:</label>
        <input type="password" style="width: 395px;" [(ngModel)]="accountData.password" placeholder="Leave blank to keep current password"/>
      </div>
    </div>

    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>

    <div class="buttons">
      <button (click)="updateAccount()" [disabled]="isLoading">
        {{ isLoading ? 'Updating...' : 'Update' }}
      </button>
      <button (click)="deleteAccount()" style="background-color: red;">Delete</button>
    </div>
    
  </div>
</div>
