<div class="page-container">
  <div class="modules-info">
    <h1>Accounts</h1>
  </div>

  <button class="functionButtons" routerLink="/account-view-admin/account-detail-create-admin">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor" className="size-6">
      <path strokeLinecap="round" strokeLinejoin="round" d="M12 9v6m3-3H9m12 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
    </svg>  
    Create Account
  </button>

  <div class="functionRow">
    <input type="text" placeholder="Account ID" [(ngModel)]="searchParams.accId"/>
    
    <input type="text" placeholder="Account Name" style="width: 270px;" [(ngModel)]="searchParams.username"/>
    
    <input type="text" placeholder="Program" [(ngModel)]="searchParams.program"/>
    
    <input type="text" placeholder="Intake" [(ngModel)]="searchParams.intake"/>
    
    <select style="width: 270px;" [(ngModel)]="searchParams.role">
      <option value="" disabled selected hidden>Role</option>
      <option *ngFor="let role of roles" [value]="role">{{ role }}</option>
    </select>
    <button class="functionButtons" (click)="onSearch()">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor" className="size-6">
        <path strokeLinecap="round" strokeLinejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
      </svg>      
      Search
    </button>
  </div>
  
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>No.</th>
          <th style="width: 144px;">Account ID</th>
          <th style="width: 270px;">Account Name</th>
          <th style="width: 144px;">Program</th>
          <th style="width: 144px;">Intake</th>
          <th style="width: 270px;">Role</th>
          <th style="width: 144px;">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let data of accounts; let i = index">  
          <td> {{ i + 1 }} </td>
          <td>{{ data.id }}</td>
          <td>{{ data.name }}</td>
          <td>{{ data.program }}</td>
          <td>{{ data.intake }}</td>
          <td>{{ data.role }}</td>
          <td> 
            <a class="nav-item" [routerLink]="['/account-view-admin/account-detail-modify-admin', data.id]">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor" className="size-6">
                <path strokeLinecap="round" strokeLinejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" />
              </svg>
            </a>
            <a class="nav-item" data-toggle="modal" data-target="#deleteModal" (click)="openDeleteModal(data)" style="cursor: pointer;">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="#dc3545" className="size-6">
                <path strokeLinecap="round" strokeLinejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
              </svg>
            </a>            
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div
    class="modal fade"
    id="deleteModal"
    role="dialog"
    aria-labelledby="deleteModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h3 class="modal-title" id="exampleModalLabel" style="font-size: 18px; width: 100%; text-align: center;">Warning</h3>
        </div>
        <div class="modal-body">
          <p>Are you sure you want to delete account "{{ selectedAccount?.name }}"?</p>
        </div>
        <div class="modal-footer" style="justify-content: center;">
          <button type="button" class="delete-btn" (click)="confirmDelete()" data-dismiss="modal">Delete</button>
          <button type="button" class="cancel-btn-delete-form" data-dismiss="modal">
            Cancel
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
