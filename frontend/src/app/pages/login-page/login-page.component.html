<div class="page-container">
  <div class="login-box">
    <h1 class="system-title">VGU Attendance Management System</h1>
    <div class="login-form">
      <h2>Welcome back!</h2>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
        <div class="form-group">
          <label for="email">Email:</label>
          <input 
            type="email" 
            id="email" 
            formControlName="email"
            placeholder="Enter your email"
            autocomplete="email"
            [attr.aria-invalid]="email?.invalid && (email?.dirty || email?.touched)"
          >
          <div class="validation-feedback" *ngIf="email?.invalid && (email?.dirty || email?.touched)">
            <div *ngIf="email?.errors?.['required']" class="error-text">Email is required.</div>
            <div *ngIf="email?.errors?.['email']" class="error-text">Please enter a valid email address.</div>
          </div>
        </div>
      
        <div class="form-group">
          <label for="password">Password:</label>
          <input 
            type="password" 
            id="password" 
            formControlName="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            [attr.aria-invalid]="password?.invalid && (password?.dirty || password?.touched)"
          >
          <div class="validation-feedback" *ngIf="password?.invalid && (password?.dirty || password?.touched)">
            <div *ngIf="password?.errors?.['required']" class="error-text">Password is required.</div>
          </div>
        </div>
      
        <div *ngIf="errorMessage" class="error-message" role="alert">
          {{ errorMessage }}
        </div>

        <button
          type="submit"
          [disabled]="loginForm.invalid || isLoading"
          class="login-btn"
        >
          <span *ngIf="!isLoading">Login</span>
          <span *ngIf="isLoading">Logging in...</span>
        </button>
      </form>      
    </div>
  </div>
</div>
