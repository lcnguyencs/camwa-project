<div class="page-container">
  <div class="modules-info">
    <h1>Module Information</h1>
  </div>

  <div class="module-detail" *ngIf="module">
      <div class="form-group row">
        <div class="field">
          <label>Module Name:</label>
          <input 
            type="text" 
            [(ngModel)]="moduleName" 
            style="width: 288px;"
          />
        </div>
        <div class="field">
          <label>Lecturer:</label>
          <select [(ngModel)]="lecturer" style="width: 288px;">
            <option [ngValue]="''">Select a lecturer</option>
            <option *ngFor="let lect of lecturers" 
                    [ngValue]="lect.staff_id">
              {{ lect.name }}
            </option>
          </select>
        </div>
      </div>

      <div class="form-group row" style="margin-top: 6px;">
        <div class="field">
          <label>Program:</label>
          <select [(ngModel)]="program">
            <option [ngValue]="''">Select a program</option>
            <option *ngFor="let prog of programs" 
                    [ngValue]="prog.program_id">
              {{ prog.name }}
            </option>
          </select>
        </div>
        <div class="field">
          <label>Semester:</label>
          <select [(ngModel)]="semester">
            <option [ngValue]="''">Select a semester</option>
            <option *ngFor="let sem of semesters" 
                    [ngValue]="sem.sem_id">
              {{ sem.name }}
            </option>
          </select>
        </div>
        <div class="field">
          <label>Intake Year:</label>
          <select [(ngModel)]="intake">
            <option [ngValue]="''">Select an intake year</option>
            <option *ngFor="let year of intakes" 
                    [ngValue]="year.toString()">
              {{ year }}
            </option>
          </select>
        </div>
      </div>

      <div class="form-group row" style="margin-top: 6px;">
        <div class="field">
          <label>Begin Date:</label>
          <input type="date" [(ngModel)]="beginDate" style="margin-right: 8px;" disabled title="This feature will be implemented soon"/>
        </div>
        <div class="field">
          <label>End Date:</label>
          <input type="date" [(ngModel)]="endDate" style="margin-right: 8px;" disabled title="This feature will be implemented soon"/>
        </div>
        <div class="field">
          <label>Exam Date:</label>
          <input type="date" [(ngModel)]="examDate" style="margin-right: 8px;" disabled title="This feature will be implemented soon"/>
        </div>
        <small style="color: #666; margin-top: 5px; font-style: italic;">* Date functionality will be implemented in a future update</small>
      </div>

      <div class="buttons">
        <button (click)="updateModule()">Update</button>
        <button (click)="cancelEdit()" style="background-color: #6c757d;">Cancel</button>
      </div>
  </div>

  <div class="loading" *ngIf="!module">
    Loading module details...
  </div>
</div>
